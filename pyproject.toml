[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gxworks2-mcp"
version = "0.1.0"
description = "MCP tools for Mitsubishi GX Works2: native ladder/SFC authoring, simulator verification, diagnostics, multi-agent collaboration and traceable handover."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Linkshub" }]
keywords = ["mcp", "gx-works2", "melsec", "plc", "ladder", "mcprotocol", "mitsubishi"]
dependencies = ["mcp>=1.2.0", "olefile>=0.46"]

[project.optional-dependencies]
ui = ["pywinauto>=0.6.8", "pywin32>=306"]
native = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
gxworks2-mcp = "gxworks2_mcp.server:main"

[tool.setuptools]
license-files = ["LICENSE", "third-party/*.txt", "third-party/README.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gxworks2_mcp = ["data/*.json", "data/*.gxw", "data/*.cs", "data/skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
